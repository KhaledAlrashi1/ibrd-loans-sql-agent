# Data dictionary for table ibrd_loans: the single source of truth for the prompt and the README.
# Descriptions are verbatim from the official metadata (data/raw/metadata_DS00047.json).
# scripts/build_db.py reads the column mapping (original_name -> column, type) from this file.
dataset:
  name: IBRD Statement of Loans and Guarantees - Latest Available Snapshot
  id: DS00047
  table: ibrd_loans
  source_url: https://financesone.worldbank.org/ibrd-statement-of-loans-and-guarantees-latest-available-snapshot/DS00047
  metadata_file: data/raw/metadata_DS00047.json
  raw_file: data/raw/ibrd_snapshot_2026-09-30.csv
  license: Creative Commons Attribution 4.0 International
  end_of_period: '2026-09-30'
  rows: 9538
  description: 'Note: IDs starting with IBRDB and IBRDG are "Guarantees" and the rest are "Loans". The loan types are as follows:
    NPL (Non-Pool Loan), CPL (Currency Pool Loan), SCPD (Single Currency Pool Loan - US), SCPM (Single Currency Pool Loan
    - EU), SCPY (Single Currency Pool Loan - YE), SCL (Single Currency Loan), FSL (Fixed Spread Loan), BLNR (IBRD Regular
    B-Loans), GURB (IBRD Guarantees), BLNC (IBRD Contingency B Loan), and GUBF (IBRD Guarantee Facility). The International
    Bank for Reconstruction and Development (IBRD) loans are public and publicly guaranteed debt extended by the World Bank
    Group. IBRD loans are made to, or guaranteed by, countries / economies that are members of IBRD. IBRD may also make loans
    to IFC. IBRD lends at market rates. Data are in U.S. dollars calculated using historical rates. This dataset contains
    the latest available snapshot of the Statement of Loans. The World Bank complies with all sanctions applicable to World
    Bank transactions.'
columns:
- column: end_of_period
  original_name: End of Period
  type: DATE
  description: End of Period Date represents the date as of which balances are shown in the report.
  source: official metadata DS00047
  nulls: 0
  allowed_values:
  - '2026-09-30'
- column: loan_number
  original_name: Loan Number
  type: VARCHAR
  description: For IBRD, a loan number consists of the organization prefix (IBRD) and a five-character label that uniquely
    identifies the loan within the organization. IDs starting with IBRDB and IBRDG are "Guarantees" and the rest are "Loans".
  source: official metadata DS00047
  nulls: 0
  example_values:
  - IBRD45620
  - IBRD80840
  - IBRD95380
  known_quirks:
  - 'Known quirk: prefixes IBRDK (62 rows, all FSL, recent) and IBRDS (21 rows, old NPL/CPL) are not documented.'
  - 'Known quirk: 1,221 loan numbers end in a letter (e.g. IBRD2754S, IBRD3750A); the meaning is not documented.'
- column: region
  original_name: Region
  type: VARCHAR
  description: World Bank Region to which country / economy and loan belong. Country / Economy lending is grouped into regions
    based on the current World Bank administrative (rather than geographic) region where project implementation takes place.
    The Other Region is used for loans to IFC.
  source: official metadata DS00047
  nulls: 0
  allowed_values:
