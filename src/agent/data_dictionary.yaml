- column: is_guarantee
  original_name: null
  type: BOOLEAN
  description: 'Derived: TRUE when loan_number starts with IBRDB or IBRDG. Official rule (dataset description): "IDs starting
    with IBRDB and IBRDG are Guarantees and the rest are Loans."'
  source: derived in scripts/build_db.py from the official rule
  nulls: 0
  allowed_values:
  - true
  - false
  data_check: '113 TRUE (IBRDB 56, IBRDG 57). Loan types under TRUE: GURB 84, BLNR 18, GUBF 9, BLNC 2. No GURB/GUBF/BLNR/BLNC
    row has is_guarantee = FALSE.'
  known_quirks:
  - 'Known quirk: includes 20 B-loans (BLNR 18, BLNC 2) because they carry the IBRDB prefix.'
- column: is_regional_entry
  original_name: null
  type: BOOLEAN
  description: 'Derived: TRUE when country_code contains a digit. In this snapshot that is exactly 6R Caribbean, 3E Eastern
    and Southern Africa, 3S Southern Africa, 3W Western and Central Africa: multi-country regional groupings, not countries.'
  source: derived in scripts/build_db.py
  nulls: 0
  allowed_values:
  - true
  - false
  data_check: 25 TRUE. build_db.py hard-checks the row count and the 4 codes.
notes:
- id: outstanding_balance
  type: rule
  note: 'Outstanding/owed balance = borrowers_obligation_usd (official: due_to_ibrd_usd + exchange_adjustment_usd). Never
    use due_to_ibrd_usd alone for ''outstanding'' or ''owed''.'
- id: no_derived_amounts
  type: rule
  note: 'Always use stored amount columns directly. Never derive amounts by arithmetic: original = cancelled + undisbursed
    + disbursed fails for 1,114 rows (mostly FSL/SCL).'
- id: interest_rate
  type: rule
  note: interest_rate 0 means multiple rates (all FSL, some others), not 0%. NULL = guarantees. Averages use only interest_rate
    > 0 and the answer says so. Values look like percent; units are not documented. The answer must also say it is an unweighted
    average over loans with a single reported rate, mostly older loans, and that multiple-rate loans (all FSL, some SCL) are not included.
- id: regional_entries
  type: rule
  note: Country rankings exclude is_regional_entry rows by default and say so. 'Southern Africa' (regional, 3S) is not 'South
    Africa' (ZA).
- id: guarantees_excluded
  type: rule
  note: Loan questions exclude is_guarantee rows by default and say so. The official prefix rule (IBRDB/IBRDG) also includes
    20 B-loans (BLNR 18, BLNC 2).
- id: fiscal_year
  type: rule
  note: 'Default ''year'' = board_approval_fy (Jul-Jun; FY2024 = Jul 2023-Jun 2024). FY2027 is partial (Jul-Sep 2026, 44 loans):
    flag it whenever a question touches FY2027.'
- id: no_active_status
  type: rule
  note: 'There is no ''active'' status. If a question says ''active'', ask: still disbursing, or has an outstanding balance?'
- id: loans_held_includes_guarantees
  type: rule
  note: loans_held_usd includes guarantee exposure (8.3B on guarantee rows).
- id: exact_category_values
  type: rule
  note: Use exact strings from allowed_values, e.g. 'MID EAST,NORTH AFRICA,AFG,PAK', 'Disbursing&Repaying', 'Turkiye', 'Korea,
    Republic of', 'Egypt, Arab Republic of', 'Cote d'Ivoire'.
- id: count_projects_distinct
  type: rule
  note: One row per loan_number; a project_id can have up to 14 loans. Count projects with COUNT(DISTINCT project_id).
- id: terminated_vs_cancelled
  type: rule
  note: Terminated = approved but never signed; officially counted as cancellations. If the question names the exact status
    ('fully cancelled'), match exactly. If it says 'cancelled loans' generally, include Terminated and say so.
- id: approved_vs_disbursed
  type: rule
  note: 'Approved/committed/loan amount = original_principal_amount_usd. Received/disbursed = disbursed_amount_usd. ''Borrowed''
    is ambiguous: state which was used.'
- id: historical_usd
  type: fact
  note: Amounts are US$ at historical exchange rates, except undisbursed_amount_usd (End of Period rates).
- id: region_is_current
  type: fact
  note: region is the current World Bank administrative region, even for old loans.
- id: currency_of_commitment_empty
  type: fact
  note: currency_of_commitment is NULL for every row; it cannot answer currency questions.
- id: no_world_or_other
  type: fact
  note: Official metadata mentions country 'World' and region 'Other' for IFC loans; neither appears in this snapshot.
- id: rounding_negatives
  type: fact
  note: 'Tiny negatives are rounding noise: undisbursed_amount_usd (min -0.01), borrowers_obligation_usd (min -0.03).'
- id: loan_status_undocumented
  type: quirk
  note: 'Known quirk: none of the 11 loan_status values is defined in official metadata.'
- id: loan_number_formats
  type: quirk
  note: 'Known quirk: IBRDK/IBRDS prefixes and trailing letters (1,221 rows) are not documented; no number starts IBRD5 or
    IBRD6.'
