# Evaluation set — IBRD Loans Text-to-SQL Agent
# Snapshot: End of Period 2026-09-30 (data/raw/ibrd_snapshot_2026-09-30.csv)
#
# How this file works
# - `question` is what the agent sees. Nothing else in this file is shown to the agent.
# - `spec` is the exact definition of the correct answer, approved by Khaled.
#   Gold SQL implements the spec, not Claude Code's own reading of the question.
# - `expected_behavior`:
#     answer  -> agent must return a result that matches the gold result
#     clarify -> agent must ask a clarifying question (no number)
#     refuse  -> agent must decline (out of scope or unsafe; no number, no SQL executed)
# - `split`: dev = used for tuning. heldout = scored only at checkpoints (Nov 10 and final).
# - Once Khaled approves a gold answer, it is frozen. Only Khaled edits gold_sql / gold_result.
#
# Scoring outcome per question: correct | abstained | wrong
#   - "answer" question: correct if the result matches; abstained if the agent declined or asked; wrong otherwise.
#   - "clarify"/"refuse" question: correct if the agent did not return a number; wrong if it did.

version: 1
snapshot: "2026-09-30"

scoring:
  money_tolerance_relative: 0.0001   # 0.01% for amounts
  ratio_tolerance_absolute: 0.001    # for shares/percentages expressed as 0-1
  rate_tolerance_absolute: 0.01      # percentage points; used for D09 and H05 (average interest rate)
  ignore_column_names: true          # compare values, not the agent's column aliases
  rankings: "compare the ordered list of keys AND the values (with tolerance)"
  columns: "Required columns = what the question asks for. Extra agent columns are allowed. Each required gold column must match some agent column (values compared with tolerance, names ignored). Row order is compared only when order_matters is true."

defaults_used_in_specs:
  - "'Loans' exclude is_guarantee rows unless the question asks about guarantees."
  - "Country rankings exclude is_regional_entry rows. Plain counts/totals of loans include them."
  - "'Owe' / 'outstanding' = SUM(borrowers_obligation_usd)."
  - "'Amount approved' / 'loan amount' / 'largest loan' = original_principal_amount_usd."
  - "'Borrowed' is ambiguous (approved vs disbursed); the agent must state which it used."
  - "'Year' = board_approval_fy (World Bank fiscal year, Jul-Jun)."
  - "Average interest rate uses only rows with interest_rate > 0."

questions:

  # ---------------- DEV (20) ----------------

  - id: D01
    split: dev
    category: count
    question: "How many IBRD loans are in the dataset?"
    expected_behavior: answer
    spec: "COUNT(*) where is_guarantee = FALSE."
    tests: "guarantees excluded by default"
    order_matters: false
    gold_sql: |
      SELECT COUNT(*) AS loans
      FROM ibrd_loans
      WHERE is_guarantee = FALSE
    gold_result:
      columns: [loans]
      rows:
      - [9425]

