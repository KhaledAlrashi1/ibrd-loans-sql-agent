      - [Brazil, 11228931299.77]
      - [Indonesia, 6203613206.320001]
      - [Philippines, 6079643536.24]
      - [China, 4446790594.799999]
      - [Morocco, 4151783521.0499997]
      - [Angola, 2989358422.21]
      - [Peru, 2405600750.19]
      - [Pakistan, 2393247690.01]

